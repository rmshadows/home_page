<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=yes">
  <meta name="theme-color" content="#eef6f1">
  <meta name="robots" content="noindex">
  <title>需要挪车</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: #142018;
      background:
        radial-gradient(90vw 42vh at 50% -8%, #d9f5e6 0%, rgba(217, 245, 230, 0) 70%),
        radial-gradient(70vw 36vh at 100% 110%, #d7e7f8 0%, rgba(215, 231, 248, 0) 68%),
        #eef3f0;
    }
    main {
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    .card {
      padding: 32px 22px 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(20, 48, 32, 0.08);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: #e7f7ee;
      color: #0c8a45;
    }
    .mark svg { display: block; width: 72px; height: 72px; }
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.25;
    }
    .lead {
      margin: 12px auto 0;
      max-width: 18em;
      font-size: 16px;
      line-height: 1.7;
      color: #5b675f;
    }
    .call {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      margin-top: 28px;
      padding: 14px 18px;
      border: none;
      border-radius: 16px;
      background: #0c9a4b;
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .call svg {
      width: 22px;
      height: 22px;
      margin-right: 8px;
      flex: 0 0 auto;
    }
    .call:active { background: #087a3b; }
    .or {
      display: flex;
      align-items: center;
      margin: 22px 4px 14px;
      color: #8b968f;
      font-size: 13px;
    }
    .or::before,
    .or::after {
      content: "";
      height: 1px;
      flex: 1 1 auto;
      background: #e6ece8;
    }
    .or span { padding: 0 12px; }
    .dial {
      display: block;
      padding: 14px 16px 13px;
      border: 1px solid #e3ebe6;
      border-radius: 16px;
      background: #f7faf8;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-user-select: text;
      user-select: text;
    }
    .dial:active { background: #eef6f1; }
    .dial small {
      display: block;
      margin-bottom: 4px;
      color: #7d8982;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .dial strong {
      display: block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }
    .copy {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid #d7e6dc;
      border-radius: 16px;
      background: #fff;
      color: #0c8a45;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .copy svg {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex: 0 0 auto;
    }
    .copy:active { background: #f2f8f4; }
    .copy.is-done {
      border-color: #b9dfc8;
      background: #eef8f2;
      color: #087a3b;
    }
    .hint {
      margin: 12px 8px 0;
      font-size: 12px;
      line-height: 1.5;
      color: #8b968f;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 10;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(20, 32, 24, 0.88);
      color: #fff;
      font-size: 14px;
      line-height: 1.3;
      white-space: nowrap;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.is-show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (hover: hover) {
      .call:hover { background: #0b8c44; }
      .dial:hover { border-color: #cfe3d6; background: #f2f8f4; }
      .copy:hover { border-color: #b9dfc8; background: #f7fbf8; }
    }
    @media (min-width: 768px) {
      main { max-width: 440px; padding: 40px 24px; }
      .card { padding: 40px 36px 32px; }
      h1 { font-size: 34px; }
      .lead { font-size: 17px; }
    }
    @media (max-width: 360px) {
      .card { padding: 26px 16px 16px; border-radius: 22px; }
      h1 { font-size: 26px; }
      .lead { font-size: 15px; }
      .dial strong { font-size: 20px; letter-spacing: 0.03em; }
    }
    @media (max-height: 560px) {
      main { margin-top: 12px; margin-bottom: 12px; }
      .mark { width: 56px; height: 56px; margin-bottom: 12px; }
      .mark svg { width: 56px; height: 56px; }
      .call { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <!--
    本文件由 build.py 根据 config.toml 生成，请勿手改文案/号码。
    修改请编辑 config.toml 后重新运行: python3 build.py
  -->
  <main data-phone="13779917551">
    <section class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 72 72" fill="none">
          <rect width="72" height="72" rx="22" fill="#e7f7ee"/>
          <path d="M18 42.5v-7.2c0-1.2.6-2.3 1.6-2.9l12.2-7.2a6 6 0 0 1 6.1 0l12.5 7.2c1 .6 1.6 1.7 1.6 2.9v7.2" stroke="#0c8a45" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M22.5 42.5V38a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4.5M39.5 42.5V38a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4.5" stroke="#0c8a45" stroke-width="2.4"/>
          <path d="M16 44.5h40" stroke="#0c8a45" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="25" cy="48" r="3.2" fill="#0c8a45"/>
          <circle cx="47" cy="48" r="3.2" fill="#0c8a45"/>
        </svg>
      </div>
      <h1>需要挪车请拨打</h1>
      <p class="lead">您好，如果我的车辆影响了您的通行，请联系车主（如未接通请短信留言）。</p>
      <a class="call" id="callBtn" href="tel:13779917551">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M7.1 3.8c.4-.4 1-.5 1.5-.3l2.2.9c.5.2.8.7.8 1.2l-.2 2.4a1.2 1.2 0 0 1-.7 1l-1.3.6a10.6 10.6 0 0 0 5 5l.6-1.3c.2-.4.6-.6 1-.7l2.4-.2c.5 0 1 .3 1.2.8l.9 2.2c.2.5.1 1.1-.3 1.5l-1.6 1.6c-.4.4-1 .6-1.6.5C10.8 18.2 5.8 13.2 4.9 6.9c-.1-.6.1-1.2.5-1.6l1.7-1.5Z"/>
        </svg>
        一键联系车主
      </a>
      <div class="or"><span>或直接拨打</span></div>
      <a class="dial" id="dialBtn" href="tel:13779917551">
        <small>点按拨号</small>
        <strong id="phoneText">137 7991 7551</strong>
      </a>
      <button class="copy" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9 3.8A1.8 1.8 0 0 1 10.8 2h6.4A1.8 1.8 0 0 1 19 3.8v10.4A1.8 1.8 0 0 1 17.2 16h-1.4v1.2A1.8 1.8 0 0 1 14 19H5.8A1.8 1.8 0 0 1 4 17.2V6.8A1.8 1.8 0 0 1 5.8 5H7.2V3.8Zm1.8.7V5h2.4A1.8 1.8 0 0 1 15 6.8V14h2.2V4.5H10.8ZM5.8 6.5v10.7H14V6.5H5.8Z"/>
        </svg>
        <span id="copyLabel">无法拨打？复制号码</span>
      </button>
      <p class="hint">电脑或无法唤起拨号时，可复制号码后用手机拨打。</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      var root = document.querySelector("main[data-phone]");
      var phone = (root.getAttribute("data-phone") || "").replace(/\D/g, "");
      if (!phone) return;

      var callBtn = document.getElementById("callBtn");
      var dialBtn = document.getElementById("dialBtn");
      var phoneText = document.getElementById("phoneText");
      var copyBtn = document.getElementById("copyBtn");
      var copyLabel = document.getElementById("copyLabel");
      var toast = document.getElementById("toast");
      var toastTimer = null;
      var resetTimer = null;

      callBtn.href = "tel:" + phone;
      dialBtn.href = "tel:" + phone;
      phoneText.textContent = formatPhone(phone);

      copyBtn.addEventListener("click", function () {
        copyText(phone).then(function (ok) {
          showToast(ok ? "号码已复制" : "复制失败，请长按号码手动复制");
          if (!ok) return;
          copyBtn.classList.add("is-done");
          copyLabel.textContent = "已复制到剪贴板";
          clearTimeout(resetTimer);
          resetTimer = setTimeout(function () {
            copyBtn.classList.remove("is-done");
            copyLabel.textContent = "无法拨打？复制号码";
          }, 2000);
        });
      });

      function formatPhone(value) {
        if (/^1\d{10}$/.test(value)) {
          return value.slice(0, 3) + " " + value.slice(3, 7) + " " + value.slice(7);
        }
        return value;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("is-show");
        }, 1800);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function () {
            return true;
          }).catch(function () {
            return fallbackCopy(text);
          });
        }
        return Promise.resolve(fallbackCopy(text));
      }

      function fallbackCopy(text) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-9999px";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, text.length);
        var ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (e) {
          ok = false;
        }
        document.body.removeChild(area);
        return ok;
      }
    })();
  </script>
</body>
</html>
